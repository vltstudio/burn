[package]
name = "audio-resolver"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
