[package]
name = "ytmusicdt"
version = "0.1.5"
description = "YouTube Music desktop client"
authors = ["Nikolay Pantseleev"]
edition = "2021"
rust-version = "1.90"

[workspace]
members = ["audio-resolver"]
default-members = ["."]
resolver = "2"

[lib]
name = "ytmusicdt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
audio-resolver = { path = "audio-resolver" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "json",
] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "time", "sync"] }
chrono = { version = "0.4", features = ["clock"] }
sha1 = "0.10"
lofty = "0.22.2"
tauri-plugin-dialog = "2.0.0-rc.8"

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
